name: debug-suspects

# TEMPORARY (the CI-hang hunt): run each spawn-based test file in ISOLATION
# under timeout(1) so the file that hangs names itself. Each leg is bounded
# at 90 s — a leg that times out IS the culprit. Delete when the hang is
# fixed.

on:
  workflow_dispatch:

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26", cache: npm }
      - run: npm ci
      - name: Serial suspect isolation
        run: |
          for f in revert-integration server-turns server-write-file server-mega-commit; do
            echo "=== tests/$f.test.mjs ==="
            timeout 90 node --test --test-timeout=10000 "tests/$f.test.mjs" 2>&1 | tail -6
            echo "exit=$? (124 = TIMED OUT = the hang)"
          done
