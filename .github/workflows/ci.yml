name: CI

# The server check (tools/check-server.mjs) and the unit suite (node --test
# tests/) — the e2e leg stays out (it drives the desktop app; CI has none).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 10 was a self-inflicted kill: npm ci + the suite run ~10-11 min on a
    # runner (the owner's Mac does it in ~7) — GitHub marked both kills
    # "cancelled", measured twice. 20 gives the suite its honest room.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26", cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
